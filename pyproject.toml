[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "market-feed-reliability-lab"
version = "0.1.0"
description = "A testbed for sequence integrity and recovery in WebSocket market-data feeds."
requires-python = ">=3.14"
dependencies = [
    "websockets>=15,<16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"